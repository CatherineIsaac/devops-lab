name: Hello DevOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run automated unit tests
        run: python -m unittest -v test_app.py
      - name: Install security scanner
        run: python -m pip install bandit

      - name: Run Python security scan
        run: bandit -r app.py
      - name: Build Docker image
        run: docker build -t hello-devops:ci .

      - name: Start application container
        run: docker run -d --name hello-devops-ci -p 8000:8000 hello-devops:ci

      - name: Test HTTP response
        run: |
          for i in $(seq 1 10); do
            if curl --fail --silent http://localhost:8000/; then
              echo
              echo "Application HTTP test passed"
              exit 0
            fi
            sleep 2
          done
          echo "Application HTTP test failed"
          docker logs hello-devops-ci
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f hello-devops-ci || true
